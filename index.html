<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFD93B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루 예보">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>하루 예보</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
</head>
<body class="petonly">
<div id="app">
  <!-- 🐶 다루 -->
  <section class="view on" data-v="home">
    <div class="yard" id="yard">
      <div class="sky" id="sky"></div>
      <button class="backpet" id="backPet" hidden>🐶 팻만 보기</button>
      <div class="bubble" id="bubble" hidden><div class="text"></div><div class="btns"></div></div>
      <img class="pet" id="pet" alt="팻" draggable="false">
      <div class="ground"></div>
    </div>
    <div class="homeinfo" id="homeInfo"></div>

  </section>

  <!-- 💞 소개팅 -->
  <section class="view" data-v="match">
    <header><h2>💞 소개팅</h2></header>
    <div id="matchBox"></div>
  </section>

  <!-- 💬 대화방 -->
  <section class="view" data-v="chat">
    <div id="chatBox"></div>
  </section>

  <!-- 📞 연락처 -->
  <section class="view" data-v="people">
    <header><h2>📞 연락처</h2><button class="btn small" id="pAdd">➕ 추가</button></header>
    <div class="card" id="pAsk"></div>
    <div class="row"><input id="pQ" placeholder="🔍 이름·번호 찾기"></div>
    <div class="row"><input id="pCode" placeholder="🔗 받은 초대 코드 붙여 넣기"><button class="btn small" id="pJoin">연결</button></div>
    <div id="pList"></div>
  </section>

  <!-- 🛡️ 지킴이 -->
  <section class="view" data-v="safe">
    <header><h2>🛡️ 지킴이</h2></header>
    <div id="safeBox"></div>
  </section>

  <!-- ⏰ 시간 -->
  <section class="view" data-v="time">
    <header><h2>⏰ 시간 · 알람 · 생일</h2></header>
    <div id="timeBox"></div>
  </section>

  <!-- 🎵 뮤직방 -->
  <section class="view" data-v="music">
    <header><h2>🎵 뮤직</h2></header>
    <div id="musicBox"></div>
  </section>

  <!-- 📖 성경 보며 듣기 -->
  <section class="view" data-v="bible">
    <header><h2>📖 성경</h2></header>
    <div id="bibleBox"></div>
  </section>

  <!-- 🧭 길찾기 -->
  <section class="view" data-v="route">
    <header><h2>🧭 길찾기</h2></header>
    <div id="routeBox"></div>
  </section>

  <!-- 🌿 둘러보기 -->
  <section class="view" data-v="tour">
    <header><h2>🌿 둘러보기</h2></header>
    <div id="tourBox"></div>
  </section>

  <!-- 📺 TV방 -->
  <section class="view" data-v="tv">
    <header><h2>📺 TV</h2></header>
    <div id="tvBox"></div>
  </section>

  <!-- 📖 안내소식 -->
  <section class="view" data-v="guide">
    <header><h2>📖 안내소식</h2></header>
    <div id="guideBox"></div>
  </section>

  <!-- ⚙️ 설정 -->
  <section class="view" data-v="set">
    <header><h2>⚙️ 설정</h2><button class="btn" id="setSave" disabled>💾 저장</button></header>
    <div id="setBox"></div>
    <div id="saveBar" hidden><span>바꾼 것이 있어요 · 저장해야 바뀌어요</span><button class="btn" id="setSave2">💾 저장</button><button class="btn ghost" id="setUndo">되돌리기</button></div>
  </section>

  <div class="talk" id="talk">
      <button class="mode" id="modeBtn" aria-label="대화/검색 바꾸기">🔎</button>
      <span class="tfw"><img class="tface" id="tFace" src="chars/dog/정면.webp" alt="음소거" title="누르면 소리 끄기/켜기"><i>✕</i></span>
      <input id="t" placeholder="무엇이든 찾아볼게…" autocomplete="off" enterkeyhint="send">
      <button class="mic" id="micBtn" aria-label="말로 하기">🎤</button>
    </div>

  <nav class="tabs" id="tabs">
    <button data-go="home" class="on">🐶<span id="tabPet">다루</span></button>
    <button data-go="match">💞<span>소개팅</span></button>
    <button data-go="people">📞<span>연락처</span></button>
    <button data-go="safe">🛡️<span>지킴이</span></button>
    <button data-go="time">⏰<span>시간</span></button>
    <button data-go="set">⚙️<span>설정</span></button>
  </nav>
</div>
<audio id="callAudio" autoplay playsinline></audio>
<input type="file" id="vcfFile" accept=".vcf,text/vcard,text/x-vcard" hidden>
<script src="lib/alarm.js"></script>
<script src="lib/commands.js"></script>
<script src="lib/nostr.bundle.js"></script>
<script src="chars/dog/manifest.js"></script>
<script src="chars/cat/manifest.js"></script>
<script src="chars/pig/manifest.js"></script>
<script src="core.js"></script>
<script src="people.js"></script>
<script src="match.js"></script>
<script src="chat.js"></script>
<script src="safe.js"></script>
<script src="timeset.js"></script>
<script src="guide.js"></script>
<script src="music.js"></script>
<script src="musicroom.js"></script>
<script src="tv.js"></script>
<script src="worship.js"></script>
<script src="bible.js"></script>
<script src="daangn.js"></script>
<script src="ballgame.js"></script>
<script src="lib/leaflet/leaflet.js"></script>
<script src="keys.js"></script>
<script src="route.js"></script>
<script src="map3d.js"></script>
<script src="review.js"></script>
<script src="fullmap.js"></script>
<script src="tour.js"></script>
<script src="native.js"></script>
</body>
</html>
