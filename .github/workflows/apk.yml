name: 갤럭시 앱 만들기
on:
  push:
    branches: [main]
    paths-ignore: ['tv.json', '.github/tv/**', '.github/workflows/tv-rank.yml']   # TV 순위만 바뀌면 앱은 다시 안 만듦
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # 서명 열쇠를 같은 것으로 계속 쓰기 (바뀌면 앱을 지우고 다시 깔아야 해서)
      - name: 서명 열쇠 이어 쓰기
        uses: actions/cache@v4
        with:
          path: ~/haru-key
          key: haru-keystore-v2
      - name: 서명 열쇠 준비 (없을 때만 한 번 만듦)
        run: |
          mkdir -p ~/haru-key
          [ -f ~/haru-key/debug.keystore ] || keytool -genkeypair -keystore ~/haru-key/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Haru Yebo,C=KR"
          keytool -list -keystore ~/haru-key/debug.keystore -storepass android | grep -i fingerprint || true
      - name: 웹 파일 모으기
        run: |
          mkdir -p capacitor/www
          rsync -a --exclude capacitor --exclude .github --exclude .git --exclude README.md ./ capacitor/www/
          echo "{\"build\": ${{ github.run_number }}}" > capacitor/www/version.json
      - name: 비밀 금고의 열쇠 넣기 (공개 코드에는 없음)
        env:
          TMAP_KEY: ${{ secrets.TMAP_KEY }}
          TOUR_KEY: ${{ secrets.TOUR_KEY }}
        run: |
          if [ -n "$TMAP_KEY" ]; then sed -i "s/  tmap: ''/  tmap: '${TMAP_KEY}'/" capacitor/www/keys.js && echo "TMAP 열쇠 넣음"; else echo "TMAP 열쇠 없음 (비밀 금고에 TMAP_KEY 를 넣으면 들어감)"; fi
          if [ -n "$TOUR_KEY" ]; then sed -i "s/  tour: ''/  tour: '${TOUR_KEY}'/" capacitor/www/keys.js && echo "TOUR 열쇠 넣음"; else echo "TOUR 열쇠 없음"; fi
      - name: 안드로이드 앱 만들기
        working-directory: capacitor
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <uses-permission android:name="android.permission.SEND_SMS"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.intent.action.DIAL"/></intent><intent><action android:name="android.media.action.MEDIA_PLAY_FROM_SEARCH"/></intent><package android:name="com.kakao.talk"/><package android:name="com.towneers.www"/><package android:name="com.sec.android.app.music"/><package android:name="com.iloen.melon"/><package android:name="com.ktmusic.geniemusic"/><package android:name="com.google.android.apps.youtube.music"/><package android:name="com.spotify.music"/><package android:name="skplanet.musicmate"/><package android:name="com.naver.vibe"/><package android:name="com.google.android.youtube"/><package android:name="com.zhiliaoapp.musically"/><package android:name="com.ss.android.ugc.trill"/><package android:name="com.instagram.android"/><package android:name="com.netflix.mediaclient"/><package android:name="net.cj.cjhv.gs.tving"/><package android:name="kr.co.captv.pooqV2"/><package android:name="com.coupang.mobile.play"/><package android:name="com.disney.disneyplus"/></queries>\n</manifest>#' $M
          # 화면 위 팻 (다른 앱 위에 떠 있기)
          cp native/*.java android/app/src/main/java/kr/haruyebo/app/
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/></manifest>#' $M
          sed -i 's#</application>#<service android:name=".FloatPetService" android:exported="false" android:foregroundServiceType="specialUse|microphone"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="floating pet companion"/></service></application>#' $M
          sed -i 's#</application>#<service android:name=".HaruNotiListener" android:exported="true" android:label="하루 예보 카톡 알림" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service></application>#' $M
          sed -i 's#</application>#<receiver android:name=".HaruAlarmReceiver" android:exported="false"/></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/></manifest>#' $M
          grep -c FloatPetService $M
          # 아이콘
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f android/app/src/main/res/mipmap-$d/$f.png ] && cp www/icon-192.png android/app/src/main/res/mipmap-$d/$f.png || true
            done
          done
          npx cap sync android
          # 늘 같은 서명 열쇠로 (덮어 깔기가 되게)
          printf '\nandroid { signingConfigs { debug { storeFile file(System.getenv("HOME") + "/haru-key/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } } }\n' >> android/app/build.gradle
          printf '\ndependencies { implementation "com.google.mlkit:text-recognition-korean:16.0.0" }\n' >> android/app/build.gradle   # 🧾 영수증 글자 읽기
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../haru-yebo.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../haru-yebo-${{ github.run_number }}.apk
      - name: 내려받을 곳에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: 하루 예보 갤럭시 앱 (${{ github.run_number }})
          body: |
            받기 안내 페이지: https://yje0807111-eng.github.io/haru-yebo/get/
            갤럭시에서 아래 haru-yebo.apk 를 눌러 받고 설치하세요.
            처음 한 번은 '이 출처 허용'을 눌러야 해요 (설치 뒤에는 다시 꺼 두세요).
          files: |
            haru-yebo.apk
            haru-yebo-${{ github.run_number }}.apk
          make_latest: true
